services:
  mongodb:
    image: mongo:latest
    container_name: ${COMPOSE_PROJECT_NAME:-mern}_mongodb
    restart: always
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mern-network

  backend:
    image: ${BACKEND_IMAGE:-mern-backend:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-mern}_backend
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PORT: ${PORT:-5000}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/ecommerce}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      - mongodb
    networks:
      - mern-network

  frontend:
    image: ${FRONTEND_IMAGE:-mern-frontend:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-mern}_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    depends_on:
      - backend
    networks:
      - mern-network

volumes:
  mongo-data:
    driver: local

networks:
  mern-network:
    driver: bridge
