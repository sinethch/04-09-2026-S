services:
  mongodb:
    image: mongo:latest
    container_name: 04-09-2026-s_mongodb
    restart: always
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mern-network

  backend:
    image: ${BACKEND_IMAGE:-mern-backend:latest}
    container_name: 04-09-2026-s_backend
    restart: always
    ports:
      - "5050:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/ecommerce
      CLIENT_URL: http://167.172.77.230:5173
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - mern-network

  frontend:
    image: ${FRONTEND_IMAGE:-mern-frontend:latest}
    container_name: 04-09-2026-s_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://167.172.77.230:5050/api
    depends_on:
      - backend
    networks:
      - mern-network

volumes:
  mongo-data:
    driver: local

networks:
  mern-network:
    driver: bridge
